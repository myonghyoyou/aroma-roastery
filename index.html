<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aroma 시안</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --bg: #F6F4F1;
    --ink: #1C1714;
    --muted: #7A706A;
    --line: #DDD7D1;
    --green: #07913B; --yellow: #EDBE00; --red: #C10110; --orange: #EF7000;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 20px; padding: 48px 6vw 32px; }
  header img { width: 72px; height: auto; }
  h1 { font-size: clamp(22px, 2.4vw, 30px); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  ol { list-style: none; margin: 0; padding: 0 6vw 80px; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a { display: grid; grid-template-columns: 4ch 1fr auto; gap: 24px; align-items: baseline; padding: 22px 0; color: inherit; text-decoration: none; }
  a:hover .name, a:focus-visible .name { background: linear-gradient(90deg, var(--green), var(--yellow), var(--orange), var(--red)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .no { color: var(--muted); font-variant-numeric: tabular-nums; }
  .name { font-size: clamp(22px, 3vw, 40px); font-weight: 600; letter-spacing: -0.02em; }
  .desc { color: var(--muted); font-size: 15px; max-width: 38ch; text-align: right; }
  @media (max-width: 640px) {
    a { grid-template-columns: 3ch 1fr; }
    .desc { grid-column: 2; text-align: left; }
  }
</style>
</head>
<body>
<header>
  <img src="assets/logo/aroma-symbol.svg" alt="aroma 로고 심볼">
  <div>
    <h1>aroma 메인 페이지 시안</h1>
    <p>시안을 눌러 열어 보세요. 1440×900 화면 기준으로 만들었습니다.</p>
  </div>
</header>
<ol>
  <li><a href="02-spatial-bloom/"><span class="no">02</span><span class="name">공간에 떠 있는 심볼</span><span class="desc">스크롤하면 3D 잎이 펼쳐졌다 다시 모입니다</span></a></li>
  <li><a href="03-kinetic-aroma/"><span class="no">03</span><span class="name">원두 입자</span><span class="desc">입자가 로고로 모였다가 워드마크와 김으로 흩어집니다</span></a></li>
  <li><a href="06-grain-field/"><span class="no">06</span><span class="name">로고 색으로 만든 질감</span><span class="desc">흐르는 로고 색 위로 매장 사진이 끝까지 이어집니다</span></a></li>
</ol>
</body>
</html>
